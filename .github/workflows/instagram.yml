name: Update Instagram posts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the latest posts
        run: python3 scripts/update_instagram.py

      - name: Commit and publish any changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data img/ig
          if git diff --cached --quiet; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Instagram posts"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
